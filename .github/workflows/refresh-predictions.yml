name: Refresh predictions

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # only the predictor path runs here (XGBoost, FastF1) -- the RAG/agent
      # LLM never runs inside this job, so no GPU or model download needed
      - run: pip install fastf1 pandas pyarrow requests xgboost scikit-learn shap

      - run: python -m src.models.refresh_job

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions/
          git diff --cached --quiet || git commit -m "chore: refresh predictions"
          git diff --cached --quiet || git push
