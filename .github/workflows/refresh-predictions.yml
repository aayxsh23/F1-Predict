name: Refresh predictions

# Race weekends (Thursday to Sunday, UTC) every 30 minutes, so each session's
# data reaches the forecast soon after it ends; other days once, to roll over
# to the next race. A run whose forecast didn't change commits nothing.
on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0"
    - cron: "0 6 * * 1,2,3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes  # shared with the retrain job: one writer at a time
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m src.models.refresh_job

      - name: Commit if the forecast changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh predictions"
            git pull --rebase
            git push
          fi
