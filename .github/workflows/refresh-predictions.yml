name: Refresh predictions

# Between race weekends only: once a day Monday to Wednesday, to roll the
# forecast over to the next race. F1's live-timing server refuses GitHub's
# runners, so session data can't be loaded here; race weekends are refreshed
# from a home connection by scripts/refresh_local.ps1. If a session that has
# run can't be loaded, the job fails rather than publish a forecast that
# ignores it. A run whose forecast didn't change commits nothing.
on:
  schedule:
    - cron: "0 6 * * 1,2,3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writes  # shared with the retrain job: one writer at a time
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m src.models.refresh_job

      - name: Commit if the forecast changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh predictions"
            git pull --rebase
            git push
          fi
